name: Batch Zip -> WebP

on:
  workflow_dispatch:
    inputs:
      quality:
        description: "WebP 质量 (1-100)"
        required: false
        default: "80"
      max_size:
        description: "最大边长(像素,留空表示不缩放)"
        required: false
        default: ""
      compress_level:
        description: "zip 压缩级别 1-9(越大越慢)"
        required: false
        default: "6"
      downloader:
        description: "下载器 auto / gallery-dl / requests"
        required: false
        default: "auto"
  push:
    paths:
      - "urls.txt"
      - "scripts/process.py"
      - "requirements.txt"
      - ".github/workflows/process.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # gallery-dl 已在 requirements.txt 中,这里再做一次显式安装与版本确认,
      # 保证 CLI 可用并把版本打进 CI 日志,方便排查 403 问题。
      - name: Install gallery-dl
        run: |
          pip install gallery-dl
          python -m gallery_dl --version

      - name: Run process
        env:
          QUALITY: ${{ github.event.inputs.quality || '80' }}
          MAX_SIZE: ${{ github.event.inputs.max_size || '' }}
          COMPRESS_LEVEL: ${{ github.event.inputs.compress_level || '6' }}
          DOWNLOADER: ${{ github.event.inputs.downloader || 'auto' }}
          # 可选:在仓库 Settings -> Secrets 里配置浏览器 Cookie / 自定义请求头,
          # 用于绕过站点的 403 限制;未配置时为空,不影响普通下载。
          DOWNLOAD_HEADERS: ${{ secrets.DOWNLOAD_HEADERS }}
          DOWNLOAD_COOKIE: ${{ secrets.DOWNLOAD_COOKIE }}
        run: |
          EXTRA=""
          if [ -n "$MAX_SIZE" ]; then EXTRA="--max-size $MAX_SIZE"; fi
          python scripts/process.py \
            --urls urls.txt \
            --output output \
            --quality "$QUALITY" \
            --compress-level "$COMPRESS_LEVEL" \
            --downloader "$DOWNLOADER" \
            $EXTRA

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: webp-zips
          path: output/*.zip
          if-no-files-found: error

      - name: Create Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: output/*.zip
          generate_release_notes: true
