name: Batch Zip -> WebP

on:
  workflow_dispatch:
    inputs:
      quality:
        description: "WebP 质量 (1-100)"
        required: false
        default: "80"
      max_size:
        description: "最大边长(像素,留空表示不缩放)"
        required: false
        default: ""
      compress_level:
        description: "zip 压缩级别 1-9(越大越慢)"
        required: false
        default: "6"
  push:
    paths:
      - "urls.txt"
      - "scripts/process.py"
      - ".github/workflows/process.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run process
        env:
          QUALITY: ${{ github.event.inputs.quality || '80' }}
          MAX_SIZE: ${{ github.event.inputs.max_size || '' }}
          COMPRESS_LEVEL: ${{ github.event.inputs.compress_level || '6' }}
        run: |
          EXTRA=""
          if [ -n "$MAX_SIZE" ]; then EXTRA="--max-size $MAX_SIZE"; fi
          python scripts/process.py \
            --urls urls.txt \
            --output output \
            --quality "$QUALITY" \
            --compress-level "$COMPRESS_LEVEL" \
            $EXTRA

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: webp-zips
          path: output/*.zip
          if-no-files-found: error

      - name: Create Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: output/*.zip
          generate_release_notes: true
