name: Batch Zip -> WebP

on:
  workflow_dispatch:
    inputs:
      quality:
        description: "WebP 质量 (1-100)"
        required: false
        default: "80"
      max_size:
        description: "最大边长(像素,留空表示不缩放)"
        required: false
        default: ""
  push:
    paths:
      - "urls.txt"
      - "scripts/process.py"
      - "requirements.txt"
      - ".github/workflows/process.yml"

# 发布 Release 需要写权限
permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run process
        id: run
        env:
          QUALITY: ${{ github.event.inputs.quality || '80' }}
          MAX_SIZE: ${{ github.event.inputs.max_size || '' }}
        run: |
          set -euo pipefail
          EXTRA=""
          if [ -n "$MAX_SIZE" ]; then EXTRA="--max-size $MAX_SIZE"; fi
          python scripts/process.py \
            --urls urls.txt \
            --output output \
            --quality "$QUALITY" \
            $EXTRA

      # 脚本会把 has_output / produced / failed 写到 GITHUB_OUTPUT,
      # urls.txt 只有注释或全部下载失败时不会误报 artifact 缺失。
      - name: Upload artifacts
        if: steps.run.outputs.has_output == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: webp-zips
          path: output/*.zip
          if-no-files-found: error
          retention-days: 7

      - name: Create Release
        if: github.event_name == 'workflow_dispatch' && steps.run.outputs.has_output == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: output/*.zip
          generate_release_notes: true
